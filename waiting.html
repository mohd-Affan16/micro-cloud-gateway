<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval | Micro-Cloud</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1a1c29 0%, #0d0e15 100%); color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #252836; border: 1px solid rgba(40, 167, 69, 0.4); border-radius: 16px; padding: 50px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.6); max-width: 420px; width: 90%; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(40, 167, 69, 0.2); border-top: 4px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 25px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { color: #28a745; margin: 0 0 10px 0; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 5px; }
    .denied { color: #dc3545; }
    .approved { color: #28a745; }
    .info { color: #00ff88; font-family: monospace; margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="statusTitle">⏳ Waiting for Admin Approval</h1>
    <p id="statusText">Your login request has been sent to the cluster administrator.</p>
    <p class="info" id="userInfo"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = (params.get('email') || '').trim().toLowerCase();
    const name = params.get('name') || 'User';

    if (!email) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('statusTitle').innerText = '❌ Invalid Request';
      document.getElementById('statusTitle').style.color = '#dc3545';
      document.getElementById('statusText').innerText = 'Missing email address. Please try logging in again.';
    } else {
      document.getElementById('userInfo').innerText = `${name} | ${email}`;
    }

    let finished = false;

    async function checkStatus() {
      if (!email || finished) return;

      try {
        const res = await fetch(`/api/status?email=${encodeURIComponent(email)}`, {
          cache: 'no-store'
        });

        const data = await res.json();

        if (data.status === 'approved') {
          finished = true;
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('statusTitle').innerText = '✅ Approved!';
          document.getElementById('statusTitle').className = 'approved';
          document.getElementById('statusText').innerText = 'Redirecting you to the cluster...';
          document.getElementById('userInfo').innerText = `${data.name || name} | ${data.email || email}`;

          setTimeout(() => {
            window.location.href = `https://micro-cloud-gateway.vercel.app/bridge.html?email=${encodeURIComponent(data.email || email)}&name=${encodeURIComponent(data.name || name)}`;
          }, 1000);
          return;
        }

        if (data.status === 'denied') {
          finished = true;
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('statusTitle').innerText = '❌ Access Denied';
          document.getElementById('statusTitle').className = 'denied';
          document.getElementById('statusText').innerText = 'The administrator rejected your login request.';
          return;
        }

        setTimeout(checkStatus, 2000);
      } catch (e) {
        setTimeout(checkStatus, 3000);
      }
    }

    checkStatus();
  </script>
</body>
</html>
