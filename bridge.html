<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting... | Micro-Cloud</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1a1c29 0%, #0d0e15 100%); color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #252836; border: 1px solid rgba(40, 167, 69, 0.4); border-radius: 16px; padding: 50px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.6); max-width: 450px; width: 90%; animation: cardEntrance 0.4s ease-out; }
    @keyframes cardEntrance { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(40, 167, 69, 0.2); border-top: 4px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 25px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { color: #28a745; margin: 0 0 10px 0; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; margin: 5px 0; }
    .offline { display: none; }
    .offline h1 { color: #dc3545; }
    .offline .icon { font-size: 50px; margin-bottom: 15px; }
    .btn { background: #dc3545; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; box-sizing: border-box; transition: all 0.2s; }
    .btn:hover { background: #c82333; transform: translateY(-2px); }
    .btn-sent { background: #28a745 !important; }
    .btn-sent:hover { background: #218838 !important; }
    #notifyStatus { color: #28a745; margin-top: 15px; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card" id="checkingState">
    <div class="spinner"></div>
    <h1>🔗 Connecting to Cluster...</h1>
    <p>Verifying your desk ESP32 hardware is online.</p>
  </div>

  <div class="card offline" id="maintenanceState">
    <div class="icon">🔴</div>
    <h1>Cluster Offline</h1>
    <p>Your desk ESP32 is not responding.</p>
    <p style="color:#ff6b6b;">It may be out of power or disconnected from WiFi.</p>
    <button class="btn" id="notifyBtn" onclick="notifyAdmin()">📡 Alert Administrator</button>
    <p id="notifyStatus">✅ Alert sent to Telegram!</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || 'unknown@gmail.com';
    const name = params.get('name') || 'User';
    const ESP32_IP = 'http://192.168.0.188';

    async function checkEsp32() {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        await fetch(`${ESP32_IP}/`, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
        clearTimeout(timeout);
        window.location.href = `${ESP32_IP}/secure-entry?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}`;
      } catch (e) {
        document.getElementById('checkingState').style.display = 'none';
        document.getElementById('maintenanceState').style.display = 'block';
      }
    }

    async function notifyAdmin() {
      const btn = document.getElementById('notifyBtn');
      btn.disabled = true; btn.innerText = 'Sending...';
      try {
        const res = await fetch('/api/notify');
        const data = await res.json();
        if (data.success) {
          btn.classList.add('btn-sent'); btn.innerText = '✅ Alert Sent';
          document.getElementById('notifyStatus').style.display = 'block';
        } else { throw new Error('Failed'); }
      } catch (e) { btn.disabled = false; btn.innerText = '❌ Failed — Try Again'; }
    }

    checkEsp32();
  </script>
</body>
</html>
